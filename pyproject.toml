[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scanmerge"
version = "0.1.0"
description = "Merge Nmap and OpenVAS/GVM results into an Excel non-conformity report and flag coverage gaps."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["defusedxml>=0.7", "openpyxl>=3.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
scanmerge = "scanmerge.cli:main"
scanmerge-ui = "scanmerge.web:main"

[tool.setuptools.package-data]
scanmerge = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
